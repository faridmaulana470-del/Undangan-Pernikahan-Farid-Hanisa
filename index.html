<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags untuk Thumbnail WhatsApp & Media Sosial -->
    <meta property="og:title" content="Undangan Pernikahan Farid & Hanisa">
    <meta property="og:description" content="Tanpa mengurangi rasa hormat, kami mengundang Bapak/Ibu/Saudara/i untuk hadir di hari bahagia kami.">
   <meta property="og:image" content="https://faridmaulana470-del.github.io/Undangan-Pernikahan-Farid-Hanisa/thumbnail-baru.webp">
    <meta property="og:url" content="https://faridmaulana470-del.github.io/Undangan-Pernikahan-Farid-Hanisa/">
    <meta property="og:type" content="website">

    <title>Undangan Pernikahan Farid & Hanisa</title>
    <!-- Font Elegan dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fdfaf3;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            color: #4a4a4a;
            overflow: hidden; /* Mengunci scroll saat pertama kali dibuka */
        }
        
        /* --- GAYA UNTUK HALAMAN DEPAN (WELCOME SCREEN) --- */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('1. Cover.webp'); /* Menggunakan cover sebagai latar belakang */
            background-size: cover;
            background-position: center;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 1.2s ease-in-out;
        }

        /* Overlay gelap agar teks terbaca jelas */
        .welcome-screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.65);
        }

        .welcome-content {
            position: relative;
            z-index: 10000;
            color: #ffffff;
            padding: 20px;
            animation: fadeIn 2s ease-in-out;
        }

        .welcome-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .welcome-content p {
            font-size: 14px;
            font-weight: 300;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .btn-buka {
            background-color: #b5966f;
            color: #ffffff;
            border: none;
            padding: 12px 32px;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(181, 150, 111, 0.5);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-buka:hover {
            background-color: #9c805a;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(156, 128, 90, 0.6);
        }

        /* Animasi saat tombol diklik (Layar naik ke atas) */
        .welcome-screen.slide-up {
            transform: translateY(-100%);
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- GAYA UNTUK ISI UNDANGAN --- */
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 15px 30px rgba(181, 150, 111, 0.2);
            overflow: hidden;
        }
        
        .scene-container {
            width: 100%;
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        
        .scene-container.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        img {
            width: 100%;
            display: block;
            margin: 0;
            padding: 0;
            border-bottom: 1px solid #f0eae1;
        }
    </style>
</head>
<body>

    <!-- HALAMAN PENYAMBUTAN (WELCOME SCREEN) -->
    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-content">
            <p>The Wedding Of</p>
            <h2>Farid & Hanisa</h2>
            <p>Kami mengundang Anda untuk hadir<br>di hari bahagia kami.</p>
            <button id="btn-buka-undangan" class="btn-buka">
                <!-- Ikon amplop sederhana -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                Buka Undangan
            </button>
        </div>
    </div>

    <!-- AUDIO BACKGROUND -->
    <audio id="bgMusic" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <!-- ISI UNDANGAN UTAMA -->
    <div class="container" id="main-content">
        <div class="scene-container"> <img src="1. Cover.webp" alt="Cover Undangan"> </div>
        <div class="scene-container"> <img src="2. Prolog.webp" alt="Prolog"> </div>
        <div class="scene-container"> <img src="3. Kisah singkat.webp" alt="Kisah Singkat"> </div>
        <div class="scene-container"> <img src="4. Ayat dan do'a.webp" alt="Ayat dan Doa"> </div>
        <div class="scene-container"> <img src="5. Akad dan resepsi.webp" alt="Akad dan Resepsi"> </div>
        <div class="scene-container"> <img src="6. Terimakasih.webp" alt="Terima Kasih"> </div>
        <div class="scene-container"> <img src="7. Penutup.webp" alt="Penutup"> </div>
        <div class="scene-container"> <img src="8. Daftar pustaka.webp" alt="Daftar Pustaka"> </div>
    </div>

    <script>
        // --- LOGIKA TOMBOL BUKA UNDANGAN & MUSIK ---
        const btnBuka = document.getElementById('btn-buka-undangan');
        const welcomeScreen = document.getElementById('welcome-screen');
        const audio = document.getElementById('bgMusic');

        btnBuka.addEventListener('click', function() {
            // 1. Putar Musik
            audio.play().catch(error => console.log("Audio play failed:", error));
            
            // 2. Mainkan animasi layar terangkat ke atas
            welcomeScreen.classList.add('slide-up');
            
            // 3. Setelah animasi selesai (1.2 detik), hilangkan layar dan izinkan scroll
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                document.body.style.overflowY = 'auto'; // Mengaktifkan scroll kembali
                document.body.style.overflowX = 'hidden';
            }, 1200);
        });

        // --- LOGIKA ANIMASI SCROLL (POP-UP GAMBAR) ---
        const observerOptions = {
            threshold: 0.15, 
            rootMargin: '0px 0px -50px 0px' 
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target); 
                }
            });
        }, observerOptions);

        const targets = document.querySelectorAll('.scene-container');
        targets.forEach(target => {
            observer.observe(target);
        });
    </script>

</body>
</html>
