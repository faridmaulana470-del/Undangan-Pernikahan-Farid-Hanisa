<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Farid & Hanisa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* Warna latar belakang luar */
            text-align: center;
        }
        .container {
            max-width: 500px; /* Lebar maksimal tampilan agar pas di HP */
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        img {
            width: 100%;
            display: block;
            margin: 0;
            padding: 0;
        }
        .audio-player {
            padding: 20px;
            background: #fff;
        }
        audio {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pemutar Musik -->
        <div class="audio-player">
            <p style="font-family: sans-serif; font-size: 14px; color: #555;">Putar Musik:</p>
            <audio controls loop>
                <source src="musik.mp3" type="audio/mpeg">
                Browser Anda tidak mendukung pemutar audio.
            </audio>
        </div>

        <!-- Urutan Gambar Undangan -->
        <img src="1. Cover.png" alt="Cover Undangan">
        <img src="2. Prolog.png" alt="Prolog">
        <img src="3. Kisah singkat.png" alt="Kisah Singkat">
        <img src="4. Ayat dan do'a.png" alt="Ayat dan Doa">
        <img src="5. Akad dan resepsi.png" alt="Akad dan Resepsi">
        <img src="6. Terimakasih.png" alt="Terima Kasih">
        <img src="7. Penutup.png" alt="Penutup">
        <img src="8. Daftar pustaka.png" alt="Daftar Pustaka">
    </div>

</body>
</html>
